[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-experiments"
version = "0.1.0"
description = "SLM inference-time intervention evaluation framework"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.optional-dependencies]
# Optional CEFR-SP sentence scorer (Arase et al. Zenodo ckpt). Not required for core runs.
# Target Lightning 2.x; if load_from_checkpoint fails, pin a 2.x release compatible with your torch.
cefr-sp = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "pytorch-lightning>=2.0.0,<3",
]
# Assessment-only TSAR ModernBERT ensemble (ordinal / disagreement cross-check; never an A1 gate).
# transformers>=4.55 required for ModernBERT; torch shared with [cefr-sp].
cefr-tsar = [
    "torch>=2.0.0",
    "transformers>=4.55.0",
]
# KVL v2 uses POS-aware NLTK WordNetLemmatizer (nltk is a core dep in
# requirements.txt). No extra packages required; marker kept for install docs.
kvl-v2 = []
dev = ["pytest>=7.0"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"slm_experiments.human" = ["rubrics/*.md"]

[project.scripts]
slm_experiments = "slm_experiments.cli:main"
